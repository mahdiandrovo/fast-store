services:

  # PostgreSQL database server
  postgres:
    image: postgres:17-alpine
    container_name: fast-store-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # User Service
  user-service:
    build:
      context: .
      dockerfile: services/user-service/Dockerfile

    container_name: fast-store-user-service
    restart: unless-stopped

    ports:
      - "8001:8001"

    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/user_db

    depends_on:
      postgres:
        condition: service_healthy

  # Product Service
  product-service:
    build:
      context: .
      dockerfile: services/product-service/Dockerfile

    container_name: fast-store-product-service
    restart: unless-stopped

    ports:
      - "8002:8002"

    environment:
      PRODUCT_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/product_db

    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: